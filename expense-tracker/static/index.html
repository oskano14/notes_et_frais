<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker IA - Ticket-Fast</title>
    <!-- Chargement de HTMX depuis unpkg -->
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    
    <!-- CSS Intégré (Dark Mode & Style Sobre/Professionnel) -->
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
        }
        
        .main-wrapper {
            display: flex;
            gap: 30px;
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        
        @media (max-width: 900px) {
            .main-wrapper { flex-direction: column; }
        }
        
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }
        
        .upload-column { flex: 1; min-width: 350px; }
        .history-column { flex: 1.5; min-width: 400px; }
        
        h1, h2, h3 {
            color: #ffffff;
            margin-top: 0;
        }
        
        h1 { font-size: 2rem; text-align: center; }
        
        .subtitle {
            text-align: center;
            color: #9e9e9e;
            margin-bottom: 30px;
        }
        
        /* Upload Zone */
        .upload-zone {
            border: 2px dashed #444;
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #1a1a1a;
        }
        .upload-zone:hover {
            border-color: #3b82f6;
            background-color: #202b3c;
        }
        .upload-zone p { margin: 0; font-size: 1.1em; color: #bbb; }
        
        input[type="file"] { display: none; }
        
        /* Prévisualisation */
        .preview-container {
            display: none;
            text-align: center;
            margin-bottom: 20px;
            background-color: #121212;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .preview-container img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 6px;
            object-fit: contain;
        }
        
        /* Boutons */
        .btn {
            background-color: #3b82f6;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #2563eb; }
        .btn:disabled { background-color: #4b5563; cursor: not-allowed; }
        
        .btn-success { background-color: #10b981; margin-top: 15px;}
        .btn-success:hover { background-color: #059669; }
        
        .btn-outline {
            background-color: transparent;
            border: 1px solid #6b7280;
            color: #d1d5db;
            margin-top: 15px;
        }
        .btn-outline:hover { background-color: #374151; color: #fff; }
        
        /* Formulaire généré par le Backend */
        .form-group { margin-bottom: 16px; }
        .form-group label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 500; 
            color: #9ca3af;
            font-size: 0.9em;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            background-color: #2d2d2d;
            border: 1px solid #4b5563;
            color: #f3f4f6;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
            transition: border-color 0.2s;
        }
        .form-control:focus { outline: none; border-color: #3b82f6; }
        select.form-control { appearance: none; }
        
        /* Layout flex */
        .flex-row { display: flex; gap: 15px; }
        .flex-col { flex: 1; }
        
        /* Alertes */
        .alert { padding: 20px; border-radius: 8px; margin-top: 20px; text-align: center; }
        .alert-success { background-color: #064e3b; color: #a7f3d0; border: 1px solid #059669; }
        .alert-error { background-color: #7f1d1d; color: #fecaca; border: 1px solid #b91c1c; }
        
        /* Loader HTMX */
        .htmx-indicator { 
            display: none; 
            text-align: center; 
            color: #60a5fa; 
            margin: 15px 0; 
            font-weight: 500; 
        }
        .htmx-request .htmx-indicator { display: block; }
        .htmx-request.htmx-indicator { display: block; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- COLONNE GAUCHE : UPLOAD ET ANALYSE -->
        <div class="container upload-column">
            <h1 style="font-size: 1.8rem;">Expense Tracker IA <br><span style="color: #3b82f6; font-size: 1.4rem;">Ticket-Fast</span></h1>
            <p class="subtitle">Automatisez vos notes de frais avec l'IA</p>
            
            <form id="upload-form" hx-post="/api/analyze" hx-encoding="multipart/form-data" hx-target="#confirmation-container" hx-indicator="#loading">
                
                <div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
                    <p>📸 Prendre une photo / Choisir un fichier</p>
                    <input type="file" id="file-input" name="file" accept="image/*" required>
                </div>
                
                <div class="preview-container" id="preview-container">
                    <img id="image-preview" src="" alt="Aperçu du reçu">
                    <button type="button" class="btn btn-outline" id="reset-btn">Changer d'image</button>
                </div>
                
                <button type="submit" class="btn" id="analyze-btn" style="display: none;">Analyser le reçu</button>
                
                <div id="loading" class="htmx-indicator">
                    ⏳ Analyse de la facture en cours par l'IA...
                </div>
            </form>

            <div id="confirmation-container"></div>
        </div>

        <!-- COLONNE DROITE : HISTORIQUE -->
        <!-- hx-trigger="load, expenseAdded from:body" recharge ce div au chargement et après un ajout -->
        <div class="container history-column" hx-get="/api/expenses" hx-trigger="load, expenseAdded from:body" hx-target="#history-container" hx-indicator="#history-loading" hx-include="#filter-form">
            <h2>📜 Historique des tickets</h2>
            <p style="color: #9ca3af; font-size: 0.9em; margin-top: -10px; margin-bottom: 20px;">Synchronisé avec votre Google Sheets</p>
            
            <!-- FILTRES ET EXPORT -->
            <form id="filter-form" hx-get="/api/expenses" hx-target="#history-container" style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center;">
                <span style="color: #9ca3af; font-size: 0.9em;">Du :</span>
                <input type="date" name="start_date" class="form-control" style="width: auto; padding: 8px;" title="Date de début">
                <span style="color: #9ca3af; font-size: 0.9em;">Au :</span>
                <input type="date" name="end_date" class="form-control" style="width: auto; padding: 8px;" title="Date de fin">
                <select name="category" class="form-control" style="width: auto; padding: 8px;">
                    <option value="">Toutes les catégories</option>
                    <option value="restaurant">Restaurant</option>
                    <option value="transport">Transport</option>
                    <option value="logement">Logement</option>
                    <option value="fourniture">Fourniture</option>
                    <option value="autre">Autre</option>
                </select>
                
                <button type="submit" class="btn btn-outline" style="width: auto; margin-top: 0; padding: 8px 15px; border-color: #3b82f6; color: #3b82f6;">🔎 Filtrer</button>
                
                <a href="/api/export-pdf" id="export-pdf-btn" class="btn btn-success" style="width: auto; margin-top: 0; text-decoration: none; padding: 8px 15px;" title="Télécharger le récapitulatif PDF">📄 PDF</a>
                <a href="/api/export-csv" id="export-csv-btn" class="btn btn-outline" style="width: auto; margin-top: 0; text-decoration: none; padding: 8px 15px; background-color: #202b3c; border-color: #3b82f6;" title="Exporter les données brutes en CSV">📊 CSV</a>
            </form>

            <script>
                // Met à jour les URLs d'export avec les filtres actuels
                document.getElementById('filter-form').addEventListener('change', function() {
                    const params = new URLSearchParams(new FormData(this)).toString();
                    document.getElementById('export-pdf-btn').href = '/api/export-pdf?' + params;
                    document.getElementById('export-csv-btn').href = '/api/export-csv?' + params;
                });
            </script>
            
            <div id="history-loading" class="htmx-indicator">
                ⏳ Récupération des données depuis Google Sheets...
            </div>
            
            <div id="history-container"></div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
